<!-- App icon: cpp-logo-source.png (the hand-drawn C++ mark) centered on a plain
     white rounded-square field. Embedded as a data: URI below rather than an
     external href so it renders identically via QIcon at runtime and via
     rsvg-convert when regenerating AppIcon.icns/.ico. To redo the crop/scale,
     edit the image x/y/width/height below, or re-embed from a new source PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="155" fill="#ffffff"/>
  <image x="166" y="358.5" width="692" height="307" xlink:href="data:image/png;base64,"/>
</svg>
